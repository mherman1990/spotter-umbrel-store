version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: herman-gleaner_web_1
      APP_PORT: 3717
      # Umbrel login stays on for the browser UI. /api/* is for machines (Claude, scripts),
      # so it skips Umbrel login and Gleaner requires its own per-client tokens there instead.
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    # The release workflow fills in the image digest (scripts/bump-store.mjs).
    image: ghcr.io/mherman1990/gleaner:0.2.1@sha256:258989dc84a5129c80a3033c215e8cd6ba297792cb945cff30ad3c18f14d3a3f
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: America/Chicago
      GLEANER_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
