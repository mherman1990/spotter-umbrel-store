version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: herman-gleaner_web_1
      APP_PORT: 3717
      # Umbrel login stays on for the browser UI. /api/* is for machines (Claude, scripts),
      # so it skips Umbrel login and Gleaner requires GLEANER_API_TOKEN there instead.
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    # The release workflow fills in the image digest (scripts/bump-store.mjs).
    image: ghcr.io/mherman1990/gleaner:0.1.1@sha256:3fb8fd52e3d1d34524a8356658a4f61a431769a6d00fa83249c3edd6541e6351
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: America/Chicago
      GLEANER_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
