version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: herman-spotter_web_1
      APP_PORT: 3000
      # Umbrel login stays on for everything else. Browsers may fetch PWA icons
      # and the manifest without cookies, so those static files are exempt.
      # /cal/* is the iCal feed: calendar apps can't sign in, so the secret
      # token in its URL is the credential (unknown tokens get 404). /health/*
      # is the Apple Health Shortcut's upload link, protected the same way.
      PROXY_AUTH_WHITELIST: "/manifest.webmanifest,/icons/*,/cal/*,/health/*"

  web:
    # The release workflow fills in the image digest (scripts/bump-store.mjs).
    image: ghcr.io/mherman1990/spotter:0.16.0@sha256:57ace9c3510fd202086d128541b376074e8dc75f968674a31eb2f2555f34dd1a
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: America/Chicago
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
